services:
  agencia_milano:
    build:
      context: .
      dockerfile: Dockerfile
    image: agenciamilano:latest
    container_name: agenciamilano_web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - .:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
